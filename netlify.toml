# Netlify configuration.
#
# Deliberately NO [build] block: the build command, publish directory and Node
# version stay in the Netlify UI, and a [build] block here would override them.
# This file exists for one reason, described below.

# Deploy previews are the target of the e2e suite
# (.github/workflows/e2e-deploy-preview.yml), and a preview serves a production
# build. That build strips the `window.__cb*` handles the canvas specs read the
# camera through, because they are gated on `import.meta.env.DEV`. This flag
# widens that gate for previews only, so the production domain still ships
# without them. See src/utils/e2eHooks.ts.
[context.deploy-preview.environment]
  VITE_E2E_HOOKS = "true"

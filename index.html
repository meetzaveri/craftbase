        <!-- Pre-paint theme: apply the saved/system theme before the bundle
             loads so the boot loader + first paint match (no light flash).
             Keep this logic in sync with src/hooks/useTheme.ts. -->
        <script>
            ;(function () {
                try {
                    var stored = localStorage.getItem('cb-theme')
                    var pref =
                        stored === 'light' ||
                        stored === 'dark' ||
                        stored === 'system'
                            ? stored
                            : 'light'
                    var dark =
                        pref === 'dark' ||
                        (pref === 'system' &&
                            window.matchMedia('(prefers-color-scheme: dark)')
                                .matches)
                    if (dark) document.documentElement.classList.add('dark')
                } catch (e) {}
            })()
        </script>

        <!-- Inline startup loader (Variant A). Paints before the JS bundle
             loads; React replaces #root on first commit. Keep in sync with
             src/components/common/craftbaseLoader.css -->
        <style>
            #cb-boot {
                position: fixed;
                inset: 0;
                z-index: 9999;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 22px;
                /* Solid parchment only — the dot grid is canvas-only (behind
                   the dotGrid feature flag) and must never appear on the
                   loader. */
                background-color: #f5f0e8;
            }
            /* Dark boot loader — kept in sync with the .dark tokens in
               src/App.css so the loader matches the resolved theme. */
            .dark #cb-boot {
                background-color: #1c1814;
            }
            #cb-boot svg {
                width: 72px;
                height: 72px;
                overflow: visible;
            }
            #cb-boot .cb-mark-stroke {
                fill: none;
                stroke: #1a1612;
                stroke-dasharray: 1;
                stroke-dashoffset: 1;
                animation: cbBootDraw 2.6s ease-in-out infinite;
            }
            #cb-boot .cb-mark-s1 {
                animation-delay: 0s;
            }
            #cb-boot .cb-mark-s2 {
                animation-delay: 0.12s;
            }
            #cb-boot .cb-mark-s3 {
                animation-delay: 0.24s;
            }
            #cb-boot .cb-mark-s4 {
                animation-delay: 0.36s;
            }
            #cb-boot .cb-mark-s5 {
                animation-delay: 0.48s;
            }
            #cb-boot .cb-mark-glyph {
                fill: #1a1612;
                opacity: 0;
                transform-box: fill-box;
                transform-origin: center;
                animation: cbBootGlyphIn 2.6s ease-out infinite;
                animation-delay: 0.6s;
            }
            .dark #cb-boot .cb-mark-stroke {
                stroke: #c4901a;
            }
            .dark #cb-boot .cb-mark-glyph {
                fill: #c4901a;
            }
            @keyframes cbBootDraw {
                0% {
                    stroke-dashoffset: 1;
                }
                40% {
                    stroke-dashoffset: 0;
                }
                70% {
                    stroke-dashoffset: 0;
                }
                100% {
                    stroke-dashoffset: -1;
                }
            }
            @keyframes cbBootGlyphIn {
                0% {
                    opacity: 0;
                    transform: scale(0.85);
                }
                15% {
                    opacity: 1;
                    transform: scale(1);
                }
                55% {
                    opacity: 1;
                    transform: scale(1);
                }
                75% {
                    opacity: 0;
                    transform: scale(0.9);
                }
                100% {
                    opacity: 0;
                    transform: scale(0.85);
                }
            }
            #cb-boot .cb-wordmark {
                font-family: 'Fraunces', Georgia, serif;
                font-weight: 600;
                font-size: 22px;
                letter-spacing: 0.5px;
                color: #1a1612;
            }
            .dark #cb-boot .cb-wordmark {
                color: #f3ece0;
            }
            #cb-boot .cb-caption {
                margin-top: -10px;
                font-size: 13px;
                letter-spacing: 0.3px;
                color: #8c7e6a;
            }
            #cb-boot .cb-caption::after {
                content: '';
                animation: cbBootDots 1.4s steps(4, end) infinite;
            }
            @keyframes cbBootDots {
                0% {
                    content: '';
                }
                25% {
                    content: '.';
                }
                50% {
                    content: '..';
                }
                75% {
                    content: '...';
                }
            }
            @media (prefers-reduced-motion: reduce) {
                #cb-boot .cb-mark-stroke {
                    animation: none;
                    stroke-dashoffset: 0;
                }
                #cb-boot .cb-mark-glyph {
                    animation: none;
                    opacity: 1;
                    transform: scale(1);
                }
                #cb-boot .cb-caption::after {
                    animation: none;
                    content: '...';
                }
            }
        </style>
    </head>
